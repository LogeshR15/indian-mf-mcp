[project]
name = "indian-mf-mcp"
version = "0.4.0"
description = "MCP server providing normalized, provenance-tagged evidence on Indian mutual funds (NAV, portfolios, documents) for Claude to reason over."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "selectolax>=0.3",
  "python-dateutil>=2.9",
]

[project.urls]
Repository = "https://github.com/LogeshR15/indian-mf-mcp"
"Bug Tracker" = "https://github.com/LogeshR15/indian-mf-mcp/issues"

[project.scripts]
mf-mcp = "indian_mf_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indian_mf_mcp"]

[tool.pytest.ini_options]
markers = [
    "network: hits a real AMC/AMFI endpoint over the internet; excluded from the default run.",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "xlwt>=1.3.0",
]
